services:
  api:
    command:
      - python
      - -c
      - "print('ExoKids API dev skeleton: Phase 0 placeholder')"
    volumes:
      - ./apps/api:/app

  web:
    command:
      - node
      - -e
      - "console.log('ExoKids web dev skeleton: Phase 0 placeholder')"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:8000}
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
