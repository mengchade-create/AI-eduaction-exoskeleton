[project]
name = "exokids-api"
version = "0.0.0"
description = "ExoKids FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "sqlmodel>=0.0.22",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
