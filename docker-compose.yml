name: exokids

services:
  api:
    image: python:3.11-slim
    working_dir: /app
    command: python -c "print('ExoKids API skeleton: Phase 0 placeholder')"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    networks:
      - exokids-net
    depends_on:
      - db
      - minio

  web:
    image: node:20-alpine
    working_dir: /app
    command: node -e "console.log('ExoKids web skeleton: Phase 0 placeholder')"
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    networks:
      - exokids-net
    depends_on:
      - api

  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: exokids
      POSTGRES_USER: exokids
      POSTGRES_PASSWORD: exokids
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - exokids-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - exokids-net

networks:
  exokids-net:
    name: exokids-net
