name: exokids

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exokids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-exokids}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exokids-net

  minio:
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:9000/minio/health/live || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exokids-net

  api:
    image: python:3.11-slim
    working_dir: /app
    command:
      - sh
      - -c
      - "pip install -e . && python -c \"import os; from sqlalchemy import create_engine, text; engine = create_engine(os.environ['DATABASE_URL']); conn = engine.connect(); conn.execute(text('CREATE EXTENSION IF NOT EXISTS timescaledb')); conn.commit(); conn.close()\" && alembic upgrade head && python -m app.seeds.default_seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      EXOKIDS_SEED_PASSWORD: ${EXOKIDS_SEED_PASSWORD:-change-me-please-seed-password}
      LLM_API_KEY: ${LLM_API_KEY:-sk-placeholder}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-exokids}
      PI_SSH_KEY_PATH: ${PI_SSH_KEY_PATH:-/app/keys/id_ed25519}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./apps/api:/app
    networks:
      - exokids-net

  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - "npm ci && npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    networks:
      - exokids-net

volumes:
  pg_data:
  minio_data:
  web_node_modules:

networks:
  exokids-net:
    name: exokids-net
